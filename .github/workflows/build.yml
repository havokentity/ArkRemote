name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ARK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ark.p12"
            echo "ARK_KEYSTORE_PATH=$RUNNER_TEMP/ark.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ARK_KEYSTORE_B64 not set, signing with a throwaway debug key"
          fi

      - name: Build release APK
        env:
          ARK_KEYSTORE_PASSWORD: ${{ secrets.ARK_KEYSTORE_PASSWORD }}
          ARK_KEY_ALIAS: arkremote
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "ArkRemote-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ArkRemote-${{ github.run_number }}
          path: ArkRemote-${{ github.run_number }}.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "ArkRemote-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message }}" \
            --target "${{ github.sha }}" --latest
